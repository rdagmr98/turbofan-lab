</div><div class="tf-explain" id="tf-explain"></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Catena di comando VSV (Variable Stator Vane, statori a calettamento variabile): stelo attuatore, bilanciere, anello di sincronizzazione, braccetti e palette</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Disco rotorico del compressore di alta pressione (HPC, High Pressure Compressor) e attuatore fueldraulico con trasduttore LVDT (Linear Variable Differential Transformer)</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Flusso d’aria nello stadio: la chiusura delle VSV devia l’aria riducendo l’angolo di incidenza sul rotore</span></span><span class="iso-caption">Stadio anteriore del compressore di alta pressione (HPC) con palette statoriche a calettamento variabile (VSV). Il FADEC (Full Authority Digital Engine Control) comanda tramite l’HMU (Hydromechanical Unit, unità idromeccanica) un attuatore mosso da carburante in pressione e ne verifica la corsa con l’LVDT; bilanciere, anello di sincronizzazione (unison ring) e braccetti ruotano insieme tutte le palette secondo la schedula su N2 corretto (qui a temperatura standard ISO: −38° fino al 55 % di N2, apertura lineare fino a 0° al 97 % di N2, identica al simulatore). Il rapporto di compressione di stadio è indicativo per un HPC a 9 stadi (rapporto totale ~11–12 al decollo TOGA).</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }

  const ringShift = (share - 0.5) * 10 * DEG;
  const items = [];
  for (const deg of D.VANE_ANGLES_DEG) {
    const a = deg * DEG;
    const spinTop = pt3(D.VANE_S, D.R_RING_OUT + 1.6, a);
    const ringPin = pt3((D.RING_S0 + D.RING_S1) * 0.5, D.R_RING_OUT + 1.6, a + ringShift);
    const depth = dot3(spinTop, V);
    const w = 1.3;
    const rad = [Math.cos(a), 0, Math.sin(a)];
    const add = (p, d) => [p[0] + d[0], p[1] + d[1], p[2] + d[2]];
    const mul = (v, k) => [v[0] * k, v[1] * k, v[2] * k];
    const bar = [
      iso(add(spinTop, mul(rad, -w)), P),
      iso(add(spinTop, mul(rad, w)), P),
      iso(add(ringPin, mul(rad, w)), P),
      iso(add(ringPin, mul(rad, -w)), P),
    ];
    const stem = [
      iso(pt3(D.VANE_S - 1.1, D.R_CAS_OUT + 2.6, a), P),
      iso(pt3(D.VANE_S + 1.1, D.R_CAS_OUT + 2.6, a), P),
      iso(pt3(D.VANE_S + 1.1, D.R_RING_OUT + 1.6, a), P),
      iso(pt3(D.VANE_S - 1.1, D.R_RING_OUT + 1.6, a), P),
    ];
    const pA = iso(spinTop, P), pB = iso(ringPin, P);
    const svgStr =
      '<g class="iso-solid" data-lit="">' +
      '<path class="iso-fill" d="' + pathOf(stem, true) + '"/><path class="iso-shade" data-shade="2" d="' + pathOf(stem, true) + '"/><path class="iso-line iso-edge" data-tone="hi" d="' + pathOf(stem, true) + '"/>' +
      '<path class="iso-fill" d="' + pathOf(bar, true) + '"/><path class="iso-top" d="' + pathOf(bar, true) + '"/><path class="iso-line iso-edge" data-tone="lit" d="' + pathOf(bar, true) + '"/>' +
      '<circle cx="' + pA[0].toFixed(1) + '" cy="' + pA[1].toFixed(1) + '" r="1.4" fill="var(--anatomy-lit)"/>' +
      '<circle cx="' + pB[0].toFixed(1) + '" cy="' + pB[1].toFixed(1) + '" r="1.4" fill="var(--anatomy-lit)"/>' +
      '</g>';
    items.push({ depth, svgStr });
  }
  items.sort((a, b) => a.depth - b.depth);
  return items.map((x) => x.svgStr).join("");
}

function buildBellcrank(share) {
  const ringShift = (share - 0.5) * 10 * DEG;
  const rodS = D.ROD_TIP_REST + D.ROD_STROKE * share;
  const rodTip = [D.ACT_F.o[0], D.ACT_F.o[1] - rodS, D.ACT_F.o[2]];
  const piv = D.PIV;
  const lug = pt3((D.RING_S0 + D.RING_S1) * 0.5, D.R_RING_OUT + 1.2, 13 * DEG + ringShift);
  const pRod = iso(rodTip, P), pPiv = iso(piv, P), pLug = iso(lug, P);
  const lift = (p, dz) => iso([p[0], p[1], p[2] + dz], P);
  const arm1 = [lift(rodTip, -2), lift(rodTip, 2), lift(piv, 2.2), lift(piv, -2.2)];
  const arm2 = [lift(piv, -2.2), lift(piv, 2.2), lift(lug, 2.2), lift(lug, -2.2)];
  return (
    '<g class="iso-solid" data-lit="">' +
    '<path class="iso-fill" d="' + pathOf(arm1, true) + '"/><path class="iso-top" d="' + pathOf(arm1, true) + '"/><path class="iso-line iso-edge" data-tone="lit" d="' + pathOf(arm1, true) + '"/>' +
    '<path class="iso-fill" d="' + pathOf(arm2, true) + '"/><path class="iso-shade" data-shade="3" d="' + pathOf(arm2, true) + '"/><path class="iso-line iso-edge" data-tone="lit" d="' + pathOf(arm2, true) + '"/>' +
    '<circle cx="' + pRod[0].toFixed(1) + '" cy="' + pRod[1].toFixed(1) + '" r="2.2" fill="var(--anatomy-lit)"/>' +
    '<circle cx="' + pPiv[0].toFixed(1) + '" cy="' + pPiv[1].toFixed(1) + '" r="2.6" fill="var(--anatomy-face)" stroke="var(--anatomy-lit)" stroke-width="1"/>' +
    '<circle cx="' + pLug[0].toFixed(1) + '" cy="' + pLug[1].toFixed(1) + '" r="2.1" fill="var(--anatomy-lit)"/>' +
    '</g>'
  );
}

function buildAirBeads(vsvDeg, phase) {
  const defl = (vsvDeg - 10) * DEG * 0.65;
  let out = "";
  for (const deg of [32, 62, 92]) {
    const a = deg * DEG;
    for (let k = 0; k < 4; k++) {
      const u = (phase + k / 4 + deg * 0.003) % 1;
      const s = 10 + u * 62;
      const aNow = a + (s > 44 ? ((s - 44) / 28) * defl * 0.45 : 0);
      const pt = iso(pt3(s, 43.5, aNow), P);
      const fade = Math.min(1, u * 6, (1 - u) * 6);
      out += '<circle cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) + '" r="2.2" fill="#4fc3f7" fill-opacity="' + (0.85 * fade).toFixed(2) + '"/>';
    }
  }
  return out;
}

let target = 60, cur = 60;
let rotPhi = 0.2, airPh = 0;
let frame = 0, last = 0, clock = 0, visible = false, touring = !still.matches, idleTimer = 0;
let lastAnnounce = "";

function draw() {
  const m = model(cur);
  const offset = [0, -D.ROD_STROKE * m.share, 0];
  const o0 = iso([0, 0, 0], P), o1 = iso(offset, P);
  const dx = o1[0] - o0[0], dy = o1[1] - o0[1];
  rodG.setAttribute("transform", "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ")");
  holdStill(rodG, [dx, dy]);

  const ringShift = (m.share - 0.5) * 10 * DEG;
  unisonBackG.innerHTML = ringArcSvg(D.CAS_SPLIT + ringShift, 158 * DEG + ringShift, 8);
  unisonFrontG.innerHTML = ringArcSvg(8 * DEG + ringShift, D.CAS_SPLIT + ringShift, 10);
  const [vb, vf] = buildVanesSplit(m.vsv);
  vanesBackG.innerHTML = vb;
  vanesFrontG.innerHTML = vf;
  leversG.innerHTML = buildLevers(m.share);
  bellG.innerHTML = buildBellcrank(m.share);
  needleEl.setAttribute("d", dialNeedle(m.vsv));
  updateRotor(rotPhi);
  airG.innerHTML = buildAirBeads(m.vsv, airPh);

  const stateTxt = m.vsv < -28 ? "chiuse (protezione stallo)" : m.vsv > -3 ? "aperte (massima portata)" : "in apertura progressiva";
  const shortText = "N2 " + fmt(m.n2) + " % · VSV " + fmt(m.vsv, 1) + "° · PR stadio ~" + fmt(m.pr, 2);
  if (readout.textContent !== shortText) readout.textContent = shortText;
  n2Val.textContent = fmt(m.n2) + " %";
  stN2.textContent = fmt(m.n2) + " %";
  stVsv.textContent = fmt(m.vsv, 1) + "°";
  stPr.textContent = "~ " + fmt(m.pr, 2) + " : 1";
  stStall.textContent = stateTxt;
  stStall.parentElement.dataset.state = m.vsv < -28 ? "warn" : m.vsv > -3 ? "ok" : "info";

  if (m.n2 < 70) {
    explainEl.dataset.state = "warn";
    explainEl.textContent =
      "Ai bassi regimi (" + fmt(m.n2) + " % di N2) la portata assiale d’aria è ridotta rispetto alla velocità delle pale: le palette VSV si chiudono (" +
      fmt(m.vsv, 1) + "°) per deviare il flusso nel verso del rotore, ridurre l’angolo di incidenza sui primi stadi e preservare il margine di stallo.";
  } else if (m.n2 < 95) {
    explainEl.dataset.state = "";
    explainEl.textContent =
      "Regime intermedio (" + fmt(m.n2) + " % di N2): il FADEC fa avanzare l’attuatore e l’anello di sincronizzazione apre progressivamente tutte le palette (" +
      fmt(m.vsv, 1) + "°) seguendo la legge su N2 corretto, bilanciando portata e margine di stallo.";
  } else {
    explainEl.dataset.state = "";
    explainEl.textContent =
      "Agli alti regimi (" + fmt(m.n2) + " % di N2) la densità e la portata d’aria sono al massimo: l’attuatore porta le VSV completamente aperte (" +
      fmt(m.vsv, 1) + "°) per lasciar passare tutta la portata richiesta dal nucleo senza perdite.";
  }

  presets.forEach((b) => {
    const v = Number(b.dataset.preset);
    b.setAttribute("aria-pressed", String(Math.abs(target - v) < 2));
  });
}

function announce() {
  const m = model(target);
  const text = "N2 " + fmt(m.n2) + " percento, angolo VSV " + fmt(m.vsv, 1) + " gradi, rapporto di compressione di stadio circa " + fmt(m.pr, 2);
  stage.setAttribute("aria-valuenow", String(Math.round(target)));
  stage.setAttribute("aria-valuetext", text);
  if (liveAnn && text !== lastAnnounce) { lastAnnounce = text; liveAnn.textContent = text; }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    clock += dt;
    target = 76.5 - 21.5 * Math.cos((clock / 12) * Math.PI * 2);
    slider.value = String(Math.round(target));
  }
  cur = calm ? target : cur + (target - cur) * (1 - Math.exp(-dt / 0.22));
  if (Math.abs(target - cur) < 0.05) cur = target;
  if (!calm) {
    rotPhi = (rotPhi + (cur / 100) * 1.8 * dt) % (Math.PI * 2);
    airPh = (airPh + (0.22 + 0.35 * ((cur - 50) / 50)) * dt) % 1;
  }
  draw();
  const keepGoing = visible && (!calm || cur !== target);
  frame = keepGoing ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}

function steer(next, fromUser = true) {
  target = clamp(next, 50, 100);
  slider.value = String(Math.round(target));
  if (fromUser) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!still.matches) { touring = true; run(); } }, 9000);
    announce();
  }
  run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

document.addEventListener("visibilitychange", () => {
  if (document.hidden && frame) { cancelAnimationFrame(frame); frame = 0; }
  else if (!document.hidden && visible) run();
});

slider.addEventListener("input", () => steer(Number(slider.value)));
presets.forEach((b) => b.addEventListener("click", () => steer(Number(b.dataset.preset))));
stage.addEventListener("keydown", (e) => {
  const step = e.shiftKey ? 8 : 2;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); steer(target + step); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); steer(target - step); }
  else if (e.key === "Home") { e.preventDefault(); steer(50); }
  else if (e.key === "End") { e.preventDefault(); steer(100); }
});
draw();
announce();

window.addEventListener("keydown",function(e){if(e.key==="Escape"&&window.parent&&window.parent!==window){try{window.parent.postMessage("tf-close-fig","*");}catch(_){}}});
</script></body></html>
