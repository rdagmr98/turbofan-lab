const ELEVATION = 30;
const SHADES = 4;

    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {

const tenth = (value) => {

function pathOf(points, closed = false) {

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));

    const out = [];

function runsOf(flags, want) {

// Exact oil physics coherent with web/index.html:
// OIL P: 25 psi at 60% N2 -> 80 psi at 98% N2
// OIL T: 40 + 0.8 * N2 °C (88 °C IDLE -> 118 °C TOGA)
// OIL Q: 17.5 - 4 * N2 / 100 qt (15.1 qt IDLE -> 13.6 qt TOGA)
// Filter clogging cO (0..1):
//   cO > 0.50 -> pop-out indicator pops & ΔP warning (bypass still closed)
//   cO > 0.70 -> bypass valve opens: bo = clamp((cO - 0.70) / 0.30, 0, 1)
function model(n2, cO) {
  const u = clamp((n2 - 60) / 38, 0, 1);
  const opBase = n2 <= 60 ? 25 * Math.pow(n2 / 60, 2) : 25 + 55 * u;
  const bo = clamp((cO - 0.70) / 0.30, 0, 1);
  // Slight pressure dip before bypass cracks, recovered as bypass opens (lubrication preserved!)
  const preDip = cO <= 0.70 ? 2.5 * Math.pow(cO / 0.70, 2) : 2.5 * (1 - 0.75 * bo);
  const oilP = Math.max(0, opBase - preDip);
  const oilT = 40 + 0.8 * n2;
  const oilQ = 17.5 - 4 * (n2 / 100);
  // Indicative ΔP across filter calibrated to app thresholds: 4..7 psi clean, 20 psi at cO=0.50, 28 psi at cO=0.70, 33 psi at cO=1.0
  const dpClean = 4 + 3 * u;
  let dp;
  if (cO <= 0.50) dp = dpClean + (20 - dpClean) * Math.pow(cO / 0.50, 1.35);
  else if (cO <= 0.70) dp = 20 + 8 * ((cO - 0.50) / 0.20);
  else dp = 28 + 5 * ((cO - 0.70) / 0.30);
  const pop = cO > 0.50;
  return { u, n2, cO, bo, pop, oilP, oilT, oilQ, dp };
}

function dialNeedle(center, frac) {
  const a = (-135 + 270 * clamp(frac, 0, 1)) * DEG;
  const [dx, dy] = center;
  return lineOnTop(
    [dx - Math.sin(a) * 2.8, dy + Math.cos(a) * 2.8],
    [dx + Math.sin(a) * (D.DIAL_R - 3.6), dy - Math.cos(a) * (D.DIAL_R - 3.6)],
    D.DIAL_TOP + 0.2,
    P,
  );
}

function samplePoly(poly, u) {
  const lens = [0];
  for (let i = 1; i < poly.length; i++) lens.push(lens[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
  const total = lens[lens.length - 1];
  const dist = clamp(u, 0, 1) * total;
  let i = 1;
  while (i < poly.length - 1 && lens[i] < dist) i++;
  const span = lens[i] - lens[i - 1] || 1;
  const t = (dist - lens[i - 1]) / span;
  return [poly[i - 1][0] + (poly[i][0] - poly[i - 1][0]) * t, poly[i - 1][1] + (poly[i][1] - poly[i - 1][1]) * t];
}

function beads(key, phase, count, r, color, opacity = 0.92) {
  const poly = D.FLOW_ROUTES[key];
  if (!poly || opacity < 0.04) return "";
  let out = "";
  for (let i = 0; i < count; i++) {
    const raw = (phase + i / count) % 1;
    const u = 0.08 + 0.84 * raw;
    const fade = Math.min(1, raw * 6, (1 - raw) * 6);
    const [x, y] = samplePoly(poly, u);
    out += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + color + '" fill-opacity="' + (opacity * fade).toFixed(2) + '"/>';
  }
  return out;
}

function sightQuad(oilQ) {
  // 0..20 qt mapped to z = 13..58
  const zTop = 13 + 45 * clamp(oilQ / 20, 0.1, 0.96);
  const r = D.TANK_R + 0.3, hw = 2.4;
  const cx = D.TANK_C[0] + r * Math.cos(D.sgAngle), cy = D.TANK_C[1] + r * Math.sin(D.sgAngle);
  const tx = -Math.sin(D.sgAngle), ty = Math.cos(D.sgAngle);
  return pathOf([
    iso([cx - tx * hw, cy - ty * hw, 13], P),
    iso([cx + tx * hw, cy + ty * hw, 13], P),
    iso([cx + tx * hw, cy + ty * hw, zTop], P),
    iso([cx - tx * hw, cy - ty * hw, zTop], P),
  ], true);
}

  // Dial needles

  needleDP.setAttribute("d", dialNeedle(D.DIAL_DP, m.dp / 40));
  // Oil level in tank sight glass + filter pleated cartridge clogging tint
  tankLevel.setAttribute("d", sightQuad(m.oilQ));
  if (filtTint) {

  }

  // Animated flow beads: warm amber supply, hot orange scavenge, red-amber bypass when open!
  const cSup = "#ffb74d", cScav = "#ff8a3d", cCool = "#ffc86b", cBp = "#ff5a52";
  const bowlAlpha = clamp(1 - m.bo * 0.88, 0.12, 1);
  const bpAlpha = m.bo > 0.02 ? clamp(0.35 + 0.65 * m.bo, 0, 1) : 0;
  flowG.innerHTML =
    beads("tankToSup", flowPh, 4, 2.3, cCool) +
    beads("supToFilt", flowPh, 5, 2.4, cSup) +
    beads("bowl", flowPh * 0.85, 4, 2.2, cSup, bowlAlpha) +
    beads("bypass", flowPh * 1.15, 4, 2.6, cBp, bpAlpha) +
    beads("filtToSump", flowPh, 5, 2.4, m.bo > 0.05 ? cBp : cSup) +
    beads("sumpToScav", flowPh * 1.1, 4, 2.4, cScav) +
    beads("scavToMcd", flowPh * 1.1, 4, 2.3, cScav) +
    beads("mcdToFcoc", flowPh * 1.1, 4, 2.3, cScav) +
    beads("fcocToTank", flowPh, 5, 2.3, cCool);

  // Subtle spray droplets inside bearing sump window
  let sp = "";
  for (let i = 0; i < 4; i++) {
    const a = (flowPh * 6.28 + i * 1.57);
    const pt = iso([D.SUMP_C[0] + 6.5 * Math.cos(a), D.SUMP_C[1] + 6.5 * Math.sin(a), 36.4], P);
    sp += '<circle cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) + '" r="1.4" fill="' + (m.bo > 0.05 ? cBp : cSup) + '" fill-opacity="0.85"/>';
  }
  sprayG.innerHTML = sp;

  const statusShort = m.bo > 0.01 ? "BYPASS APERTO" : m.pop ? "ΔP ALTO" : "normale";
  const shortText = "P " + fmt(m.oilP, 0) + " psi · T " + fmt(m.oilT, 0) + " °C · ΔP " + fmt(m.dp, 0) + " psi · " + statusShort;
  if (readout.textContent !== shortText) readout.textContent = shortText;

  n2Val.textContent = fmt(m.n2, 0) + " %";
  stP.textContent = fmt(m.oilP, 0) + " psi";
  stT.textContent = fmt(m.oilT, 0) + " °C";
  stDP.textContent = fmt(m.dp, 1) + " psi (" + Math.round(m.cO * 100) + " %)";
  stDP.parentElement.dataset.state = m.bo > 0.01 ? "alert" : m.pop ? "warn" : "ok";
  stBp.textContent = m.bo > 0.01 ? "APERTO (" + Math.round(m.bo * 100) + " %)" : m.pop ? "chiuso (ind. fuori)" : "chiuso";
  stBp.parentElement.dataset.state = m.bo > 0.01 ? "alert" : m.pop ? "warn" : "ok";
  stQ.textContent = fmt(m.oilQ, 1) + " qt";

  if (m.bo > 0.01) {
    explainEl.dataset.state = "alert";
    explainEl.textContent =
      "FILTRO OLIO OSTRUITO (intasamento " + Math.round(m.cO * 100) + " %, ΔP " + fmt(m.dp, 0) +
      " psi > soglia bypass): la valvola di bypass si è aperta. L’olio salta la cartuccia e arriva NON FILTRATO ai cuscinetti, ma la pressione (" +
      fmt(m.oilP, 0) + " psi) resta garantita: meglio olio non filtrato che restare senza lubrificazione.";
  } else if (m.pop) {
    explainEl.dataset.state = "warn";
    explainEl.textContent =
      "ΔP FILTRO OLIO ALTO (intasamento " + Math.round(m.cO * 100) + " %, ΔP " + fmt(m.dp, 0) +
      " psi): l’indicatore a scatto è uscito e il pressostato avvisa la cabina, ma la valvola di bypass è ancora chiusa (apre oltre il 70 %).";
  } else {
    explainEl.dataset.state = "";
    explainEl.textContent =
      "Funzionamento normale a N2 " + fmt(m.n2, 0) + " %: la pompa di mandata spinge l’olio filtrato a " + fmt(m.oilP, 0) +
      " psi verso i cuscinetti; le pompe di recupero (portata maggiore) riportano olio e aria tramite il rilevatore di limatura (MCD) e lo scambiatore olio/carburante (FCOC) fino al serbatoio (" +
      fmt(m.oilT, 0) + " °C).";
  }

  const phase = m.bo > 0.01 ? "Filtro intasato: bypass aperto, olio non filtrato" : m.pop ? "Delta P filtro alto: indicatore scattato, bypass chiuso" : "Circuito olio normale";
  if (phase !== lastPhase) {
    lastPhase = phase;
    stage.setAttribute("aria-valuetext", phase);
    if (liveAnn) liveAnn.textContent = phase;
  }
  clogBtn.setAttribute("aria-pressed", String(clogged));
  presets.forEach((b) => b.setAttribute("aria-pressed", String(Math.abs(n2Target - Number(b.dataset.preset)) < 2)));
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  n2Cur = calm ? n2Target : n2Cur + (n2Target - n2Cur) * (1 - Math.exp(-dt / 0.25));
  if (Math.abs(n2Target - n2Cur) < 0.05) n2Cur = n2Target;
  // Ramp clogging cO smoothly (0.18/s -> ~5.5s to full clog so both 50% and 70% thresholds are clearly visible!)
  if (calm) {
    cO = clogged ? 1 : 0;
    popRise = clogged ? 1 : 0;
  } else {
    cO = clamp(cO + dt * (clogged ? 0.18 : -0.45), 0, 1);
    const wantPop = cO > 0.50 ? 1 : 0;
    popRise += (wantPop - popRise) * (1 - Math.exp(-dt / 0.12));
    if (Math.abs(wantPop - popRise) < 0.005) popRise = wantPop;
    flowPh = (flowPh + (0.18 + 0.22 * ((n2Cur - 60) / 38)) * dt) % 1;
  }
  draw();
  const settling = Math.abs(n2Target - n2Cur) > 0.05 || (clogged ? cO < 1 : cO > 0) || Math.abs((cO > 0.5 ? 1 : 0) - popRise) > 0.005;
  frame = visible && (!calm || settling) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}

function toggleClog(next = !clogged) {
  clogged = next;
  run();
}

function setN2(v) {
  n2Target = clamp(v, 60, 98);
  slider.value = String(Math.round(n2Target));
  run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

document.addEventListener("visibilitychange", () => {
  if (document.hidden && frame) { cancelAnimationFrame(frame); frame = 0; }
  else if (!document.hidden && visible) run();
});

clogBtn.addEventListener("click", () => toggleClog());
slider.addEventListener("input", () => setN2(Number(slider.value)));
presets.forEach((b) => b.addEventListener("click", () => setN2(Number(b.dataset.preset))));
stage.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleClog(); }
  else if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setN2(n2Target + 4); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setN2(n2Target - 4); }
});
draw();

window.addEventListener("keydown",function(e){if(e.key==="Escape"&&window.parent&&window.parent!==window){try{window.parent.postMessage("tf-close-fig","*");}catch(_){}}});
</script></body></html>
