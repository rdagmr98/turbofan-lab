const fmt = (v, d = 1) => v.toFixed(d).replace(".", ",");
const pt3 = (s, r, a) => [
  ENG.o[0] + ENG.a[0] * s + r * (Math.cos(a) * ENG.u[0] + Math.sin(a) * ENG.v[0]),
  ENG.o[1] + ENG.a[1] * s + r * (Math.cos(a) * ENG.u[1] + Math.sin(a) * ENG.v[1]),
  ENG.o[2] + ENG.a[2] * s + r * (Math.cos(a) * ENG.u[2] + Math.sin(a) * ENG.v[2]),
];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const lightV = (() => {
  const c = cameraOf(P);
  const L = [-c.sinA, c.cosA, 1.2];
  const n = Math.hypot(L[0], L[1], L[2]);
  return [L[0] / n, L[1] / n, L[2] / n];
})();
const shadeOf = (n) => {
  const l = Math.hypot(n[0], n[1], n[2]) || 1;
  const sc = (n[0] * lightV[0] + n[1] * lightV[1] + n[2] * lightV[2]) / l;
  return sc >= 0.62 ? 3 : sc >= 0.42 ? 2 : sc >= 0.2 ? 1 : 0;
};

// Exact FADEC closed-loop dynamics from web/index.html:
const ffss = (n2) => (n2 < 60 ? 300 * Math.pow(Math.max(n2, 0) / 60, 1.5) : 300 + 4300 * Math.pow((n2 - 60) / 38, 2));

function dialNeedle(center, frac) {
  const a = (-135 + 270 * clamp(frac, 0, 1)) * DEG;
  const [dx, dy] = center;
  return lineOnTop(
    [dx - Math.sin(a) * 2.8, dy + Math.cos(a) * 2.8],
    [dx + Math.sin(a) * (D.DIAL_R - 3.6), dy - Math.cos(a) * (D.DIAL_R - 3.6)],
    D.DIAL_TOP + 0.2,
    P,
  );
}

function samplePoly(poly, u) {
  const lens = [0];
  for (let i = 1; i < poly.length; i++) lens.push(lens[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
  const total = lens[lens.length - 1];
  const dist = clamp(u, 0, 1) * total;
  let i = 1;
  while (i < poly.length - 1 && lens[i] < dist) i++;
  const span = lens[i] - lens[i - 1] || 1;
  const t = (dist - lens[i - 1]) / span;
  return [poly[i - 1][0] + (poly[i][0] - poly[i - 1][0]) * t, poly[i - 1][1] + (poly[i][1] - poly[i - 1][1]) * t];
}

function beads(key, phase, count, r, color, opacity = 0.92) {
  const poly = D.FLOW_ROUTES[key];
  if (!poly || opacity < 0.04) return "";
  let out = "";
  for (let i = 0; i < count; i++) {
    const raw = (phase + i / count) % 1;
    const u = 0.08 + 0.84 * raw;
    const fade = Math.min(1, raw * 6, (1 - raw) * 6);
    const [x, y] = samplePoly(poly, u);
    out += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + color + '" fill-opacity="' + (opacity * fade).toFixed(2) + '"/>';
  }
  return out;
}

function updateHpBlades(phase) {
  const sMid = 82, rHub = 14.5, rTip = 24.5, halfS = 4.2, count = 14;
  const backB = [], frontB = [];
  const daH = 1.4 / rHub, daT = 1.1 / rTip;
  for (let i = 0; i < count; i++) {
    const a = phase + (i / count) * Math.PI * 2;
    const rel = Math.cos(a - D.PHI_VIEW);
    const depth = dot3(pt3(sMid, (rHub + rTip) * 0.5, a), V);
    const p0 = iso(pt3(sMid - halfS, rHub - 0.1, a - daH), P);
    const p1 = iso(pt3(sMid - halfS * 0.85, rTip, a - daT + 0.08), P);
    const p2 = iso(pt3(sMid + halfS * 0.85, rTip, a + daT + 0.08), P);
    const p3 = iso(pt3(sMid + halfS, rHub - 0.1, a + daH), P);
    const tx = -Math.sin(a) * ENG.u[0] + Math.cos(a) * ENG.v[0];
    const ty = -Math.sin(a) * ENG.u[1] + Math.cos(a) * ENG.v[1];
    const tz = -Math.sin(a) * ENG.u[2] + Math.cos(a) * ENG.v[2];
    const sh = shadeOf([tx * 0.72 + ENG.a[0] * 0.69, ty * 0.72 + ENG.a[1] * 0.69, tz * 0.72 + ENG.a[2] * 0.69]);
    const d = pathOf([p0, p1, p2, p3], true);
    const s = '<g class="iso-solid"><path class="iso-fill" d="' + d + '"/><path class="iso-shade" data-shade="' + sh + '" d="' + d + '"/><path class="iso-line iso-edge" data-tone="hi" d="' + d + '"/></g>';
    (rel >= 0 ? frontB : backB).push({ depth, s });
  }
  backB.sort((a, b) => a.depth - b.depth);
  frontB.sort((a, b) => a.depth - b.depth);
  hpBackG.innerHTML = backB.map((x) => x.s).join("");
  hpFrontG.innerHTML = frontB.map((x) => x.s).join("");
}

let tlaTarget = 35, tlaCur = 35;
let n2 = 73.3, ff = ffss(73.3), accLim = false, decLim = false;
let rotPhi = 0.2, phSig = 0, phFuel = 0;
let frame = 0, last = 0, visible = false, lastPhase = "";

function draw() {
  const n2Dem = 60 + 38 * (tlaCur / 100);
  const err = n2Dem - n2;
  const fmvFrac = clamp((ff - 200) / 4400, 0, 1);

  // Move TLA lever smoothly along slot
  leverG.setAttribute("transform", translateAlong(P, [0, (D.TLA_Y_TOGA - D.TLA_Y_IDLE) * (tlaCur / 100), 0]));

  // Slide FMV spool rod cleanly out of sleeve (holdStill keeps clip anchored!)
  const off = [0, D.FMV_STROKE * fmvFrac, 0];
  const o0 = iso([0, 0, 0], P), o1 = iso(off, P);
  const dx = o1[0] - o0[0], dy = o1[1] - o0[1];
  fmvG.setAttribute("transform", "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ")");
  holdStill(fmvG, [dx, dy]);

  // ECU front error bar (centered at x = ECU_BOX.x + 24, spans ±15)
  const cx = D.ECU_BOX.x + 24, eyF = D.ECU_BOX.y + D.ECU_BOX.d + 0.2;
  const halfBar = clamp(err / 38, -1, 1) * 14.5;
  const bx0 = halfBar >= 0 ? cx : cx + halfBar;
  const bx1 = halfBar >= 0 ? Math.max(cx + 1.2, cx + halfBar) : Math.min(cx - 1.2, cx);
  errBar.setAttribute("d", pathOf([
    iso([bx0, eyF, 26.5], P), iso([bx1, eyF, 26.5], P),
    iso([bx1, eyF, 34.5], P), iso([bx0, eyF, 34.5], P),
  ], true));
  errBar.setAttribute("fill", accLim ? "#ffb74d" : decLim ? "#ff6b6b" : Math.abs(err) < 0.8 ? "#6be0a0" : "#4fc3f7");

  // Combustor flame intensity
  flameEl.setAttribute("fill-opacity", (0.28 + 0.68 * fmvFrac).toFixed(2));
  flameEl.setAttribute("fill", fmvFrac > 0.65 ? "#ff5722" : "#ff8a3d");

  // Front dial gauges: ERR N2 (-40..+40% centered at 0.5) & FF (0..5000 kg/h)
  needleErr.setAttribute("d", dialNeedle(D.DIAL_ERR, 0.5 + err / 80));
  needleFF.setAttribute("d", dialNeedle(D.DIAL_FF, ff / 5000));

  updateHpBlades(rotPhi);

  // Signal & fuel pulse beads around closed loop!
  const cmdCol = accLim ? "#ffb74d" : decLim ? "#ff6b6b" : "#4fc3f7";
  flowG.innerHTML =
    beads("tlaToEcu", phSig, 3, 2.0, "#4fc3f7") +
    beads("ecuToHmu", phSig * 1.1, 4, 2.1, cmdCol) +
    beads("hmuToComb", phFuel, Math.max(2, Math.round(2 + 4 * fmvFrac)), 2.4, "#ffb74d") +
    beads("n2ToEcu", phSig * 0.95, 7, 2.0, "#6be0a0");

  const sign = err >= 0.05 ? "+" : "";
  const limTxt = accLim ? "LIMITE ACCEL" : decLim ? "LIMITE DECEL" : Math.abs(err) < 0.6 ? "a regime" : "inseguimento";
  const shortText = "Domanda " + fmt(n2Dem, 1) + " % · Err " + sign + fmt(err, 1) + " % · FF " + Math.round(ff) + " kg/h";
  if (readout.textContent !== shortText) readout.textContent = shortText;

  tlaVal.textContent = Math.round(tlaTarget) + " %";
  stDem.textContent = fmt(n2Dem, 1) + " %";
  stN2.textContent = fmt(n2, 1) + " %";
  stErr.textContent = sign + fmt(err, 1) + " %";
  stErr.parentElement.dataset.state = Math.abs(err) < 0.6 ? "ok" : err > 0 ? "warn" : "info";
  stFF.textContent = Math.round(ff).toLocaleString("it-IT") + " kg/h";
  stLim.textContent = limTxt;
  stLim.parentElement.dataset.state = accLim ? "warn" : decLim ? "alert" : "ok";

  if (accLim) {
    explainEl.dataset.state = "warn";
    explainEl.textContent =
      "Transitorio in accelerazione (errore +" + fmt(err, 1) + " %): la ECU (Electronic Control Unit) taglia il comando al limite di accelerazione WF/PS3 (" +
      Math.round(ff) + " kg/h) per accelerare il rotore HP senza mandare in stallo il compressore né superare la EGT (Exhaust Gas Temperature).";
  } else if (decLim) {
    explainEl.dataset.state = "alert";
    explainEl.textContent =
      "Transitorio in decelerazione (errore " + fmt(err, 1) + " %): la ECU trattiene la portata sul limite minimo di decelerazione (" +
      Math.round(ff) + " kg/h, 55 % del regime) per evitare lo spegnimento povero della fiamma in camera.";
  } else if (Math.abs(err) >= 0.6) {
    explainEl.dataset.state = "";
    explainEl.textContent =
      "Inseguimento ad anello chiuso: il sensore N2 misura " + fmt(n2, 1) + " % rispetto alla domanda di " + fmt(n2Dem, 1) +
      " %; la valvola dosatrice FMV (Fuel Metering Valve) nell’HMU regola la portata a " + Math.round(ff) + " kg/h finché l’errore si annulla.";
  } else {
    explainEl.dataset.state = "";
    explainEl.textContent =
      "Regime stabilizzato a N2 " + fmt(n2, 1) + " % (errore ~0 %): il FADEC mantiene la valvola dosatrice FMV in equilibrio a " +
      Math.round(ff) + " kg/h. Sposta bruscamente la manetta da IDLE a TOGA (o viceversa) per osservare errore, limiti e retroazione dal vivo.";
  }

  const phase = accLim ? "Limite accelerazione attivo" : decLim ? "Limite decelerazione attivo" : Math.abs(err) < 0.6 ? "Regime stabilizzato" : "Inseguimento N2";
  if (phase !== lastPhase) {
    lastPhase = phase;
    stage.setAttribute("aria-valuetext", phase + ", domanda " + fmt(n2Dem) + " percento, N2 " + fmt(n2) + " percento");
    if (liveAnn) liveAnn.textContent = phase;
  }
  presets.forEach((b) => b.setAttribute("aria-pressed", String(Math.abs(tlaTarget - Number(b.dataset.preset)) < 4)));
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (calm) {
    tlaCur = tlaTarget;
    n2 = 60 + 38 * (tlaTarget / 100);
    ff = ffss(n2);
    accLim = false;
    decLim = false;
  } else {
    tlaCur += (tlaTarget - tlaCur) * (1 - Math.exp(-dt / 0.12));
    if (Math.abs(tlaTarget - tlaCur) < 0.05) tlaCur = tlaTarget;
    const n2t = 60 + 38 * (tlaCur / 100);
    const base = ffss(n2);
    const hi = base * 1.5 + 150;
    const lo = base * 0.55;
    const cmd = ffss(n2t) + 60 * (n2t - n2);
    accLim = cmd > hi + 1;
    decLim = cmd < lo - 1;
    const targetFF = clamp(cmd, lo, hi);
    ff += (targetFF - ff) * (1 - Math.exp(-dt / 0.30));
    const acc = (10 * (ff - base)) / (base + 400);
    n2 = clamp(n2 + acc * dt, 58, 102);
    rotPhi = (rotPhi + (n2 / 100) * 2.4 * dt) % (Math.PI * 2);
    phSig = (phSig + 0.32 * dt) % 1;
    phFuel = (phFuel + (0.16 + 0.42 * clamp((ff - 200) / 4400, 0, 1)) * dt) % 1;
  }
  draw();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}

function setTla(v) {
  tlaTarget = clamp(v, 0, 100);
  slider.value = String(Math.round(tlaTarget));
  if (still.matches) { tick(performance.now()); return; }
  run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

document.addEventListener("visibilitychange", () => {
  if (document.hidden && frame) { cancelAnimationFrame(frame); frame = 0; }
  else if (!document.hidden && visible) run();
});

slider.addEventListener("input", () => setTla(Number(slider.value)));
presets.forEach((b) => b.addEventListener("click", () => setTla(Number(b.dataset.preset))));
stage.addEventListener("keydown", (e) => {
  const step = e.shiftKey ? 25 : 10;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setTla(tlaTarget + step); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setTla(tlaTarget - step); }
  else if (e.key === "Home") { e.preventDefault(); setTla(0); }
  else if (e.key === "End") { e.preventDefault(); setTla(100); }
});
draw();

window.addEventListener("keydown",function(e){if(e.key==="Escape"&&window.parent&&window.parent!==window){try{window.parent.postMessage("tf-close-fig","*");}catch(_){}}});
</script></body></html>
