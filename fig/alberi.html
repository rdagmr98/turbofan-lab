  return { u, n1, n2, rpm1, rpm2, thr, mByp, mCore, bpr, fanShare };
}

function dialNeedle(center, pct) {
  const a = (-135 + 270 * clamp(pct / 100, 0, 1)) * DEG;
  const [dx, dy] = center;
  return lineOnTop(
    [dx - Math.sin(a) * 3.0, dy + Math.cos(a) * 3.0],
    [dx + Math.sin(a) * (D.DIAL_R - 3.8), dy - Math.cos(a) * (D.DIAL_R - 3.8)],
    D.DIAL_TOP + 0.2,
    P,
  );
}

// Rebuild rotating solid blades split into exact BACK and FRONT halves around the hub!
function updateRotor(r, phase) {
  const backB = [], frontB = [];
  const thick = Math.max(0.85, r.halfS * 0.6);
  const daHub = thick / Math.max(r.rHub, 4);
  const daTip = (thick * 0.8) / Math.max(r.rTip, 4);
  for (let i = 0; i < r.count; i++) {
    const a = phase + (i / r.count) * Math.PI * 2;
    const rel = Math.cos(a - D.PHI_VIEW);
    const midPt = pt3(r.sMid, (r.rHub + r.rTip) * 0.5, a);
    const depth = dot3(midPt, V);
    const p0 = iso(pt3(r.sMid - r.halfS, r.rHub - 0.1, a - daHub), P);
    const p1 = iso(pt3(r.sMid - r.halfS * 0.84, r.rTip, a - daTip + r.twist * 0.12), P);
    const p2 = iso(pt3(r.sMid + r.halfS * 0.84, r.rTip, a + daTip + r.twist * 0.12), P);
    const p3 = iso(pt3(r.sMid + r.halfS, r.rHub - 0.1, a + daHub), P);
    const tx = -Math.sin(a) * ENG.u[0] + Math.cos(a) * ENG.v[0];
    const ty = -Math.sin(a) * ENG.u[1] + Math.cos(a) * ENG.v[1];
    const tz = -Math.sin(a) * ENG.u[2] + Math.cos(a) * ENG.v[2];
    const sh = shadeOf([tx * 0.7 - ENG.a[0] * 0.7, ty * 0.7 - ENG.a[1] * 0.7, tz * 0.7 - ENG.a[2] * 0.7]);
    const d = pathOf([p0, p1, p2, p3], true);
    const s = '<g class="iso-solid"' + (r.lit ? ' data-lit=""' : '') + '><path class="iso-fill" d="' + d + '"/><path class="iso-shade" data-shade="' + sh + '" d="' + d + '"/><path class="iso-line iso-edge" data-tone="' + r.bTone + '" d="' + d + '"/></g>';
    (rel >= 0 ? frontB : backB).push({ depth, s });
  }
  backB.sort((a, b) => a.depth - b.depth);
  frontB.sort((a, b) => a.depth - b.depth);
  r.backEl.innerHTML = backB.map((x) => x.s).join("");
  r.frontEl.innerHTML = frontB.map((x) => x.s).join("");
}

// Rotating axial keyway stripes landing exact edge-to-edge (s0 to s1) on the shaft rims!
function shaftMarks(s0, s1, r, phase, count, tone) {
  let d = "";
  for (let k = 0; k < count; k++) {
    const a = (phase + (k / count) * Math.PI * 2) % (Math.PI * 2);
    if (Math.cos(a - D.PHI_VIEW) < 0.18) continue;
    const p0 = iso(pt3(s0, r + 0.05, a), P);
    const p1 = iso(pt3(s1, r + 0.05, a), P);
    d += "M" + p0[0].toFixed(1) + " " + p0[1].toFixed(1) + "L" + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
  }
  return d ? '<path class="iso-line" data-tone="' + tone + '" d="' + d + '" style="stroke-width:1.3"/>' : "";
}

function spinnerSpiral(phase) {
  const pts = [];
  for (let i = 0; i <= 18; i++) {
    const t = i / 18;
    const s = 1.8 + 16.0 * t;
    const r = 16.5 * Math.pow(s / 18, 0.72) + 0.18;
    const a = phase + t * Math.PI * 1.4;
    if (Math.cos(a - D.PHI_VIEW) > -0.1) pts.push(iso(pt3(s, r, a), P));
  }
  return pts.length > 1 ? pathOf(pts) : "";
}

function samplePoly(poly, u) {
  const lens = [0];
  for (let i = 1; i < poly.length; i++) lens.push(lens[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
  const total = lens[lens.length - 1];
  const dist = clamp(u, 0, 1) * total;
  let i = 1;
  while (i < poly.length - 1 && lens[i] < dist) i++;
  const span = lens[i] - lens[i - 1] || 1;
  const t = (dist - lens[i - 1]) / span;
  return [poly[i - 1][0] + (poly[i][0] - poly[i - 1][0]) * t, poly[i - 1][1] + (poly[i][1] - poly[i - 1][1]) * t];
}

function beadsHtml(poly, phase, count, r, color) {
  let out = "";
  for (let i = 0; i < count; i++) {
    const u = (phase + i / count) % 1;
    const fade = Math.min(1, u * 7, (1 - u) * 7);
    const [x, y] = samplePoly(poly, u);
    out += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + color + '" fill-opacity="' + (0.9 * fade).toFixed(2) + '"/>';
  }
  return out;
}

let target = 35, cur = 35;
let phiLP = 0.2, phiHP = 0.6, flowByp = 0, flowCore = 0;
let frame = 0, last = 0, clock = 0, visible = false, touring = !still.matches, idleTimer = 0;
let lastAnnounce = "";

function regimeLabel(tla) {
  if (tla < 8) return "Minimo a terra (IDLE)";
  if (tla < 48) return "Regime intermedio";
  if (tla < 85) return "Salita / spinta ridotta (CL · FLX)";
  return "Decollo / massima spinta (TOGA)";
}

function draw() {
  const m = model(cur);
  const dy = (D.TH_Y_TOGA - D.TH_Y_IDLE) * m.u;
  lever.setAttribute("transform", translateAlong(P, [0, dy, 0]));
  needleN1.setAttribute("d", dialNeedle(D.DIAL_N1, m.n1));
  needleN2.setAttribute("d", dialNeedle(D.DIAL_N2, m.n2));
  spiralPath.setAttribute("d", spinnerSpiral(phiLP));
  lpStripeFront.innerHTML = shaftMarks(75, 86, 5.5, phiLP, 3, "blue");
  lpStripeMid.innerHTML = shaftMarks(156, 186, 5.5, phiLP, 3, "blue");
  hpStripeFront.innerHTML = shaftMarks(147.6, 156, 11.2, phiHP, 4, "amber");
  hpStripeRear.innerHTML = shaftMarks(186, 193, 11.2, phiHP, 4, "amber");
  for (const r of rotorEls) updateRotor(r, r.spool === "lp" ? phiLP : phiHP);
  bypBeadsG.innerHTML = beadsHtml(D.BYP_2D, flowByp, 9, 2.8, "#4fc3f7");
  coreBeadsG.innerHTML = beadsHtml(D.CORE_2D, flowCore, 4, 2.2, "#ffb74d");

  const shortText = "N1 " + fmt(m.n1) + " % · N2 " + fmt(m.n2) + " % · BPR " + fmt(m.bpr) + " · " + fmt(m.thr, 0) + " kN";
  if (readout.textContent !== shortText) readout.textContent = shortText;
  tlaVal.textContent = Math.round(cur) + " %";
  stN1.textContent = fmt(m.n1) + " % (" + Math.round(m.rpm1).toLocaleString("it-IT") + " rpm)";
  stN2.textContent = fmt(m.n2) + " % (" + Math.round(m.rpm2).toLocaleString("it-IT") + " rpm)";
  stByp.textContent = fmt(m.mByp, 0) + " kg/s";
  stCore.textContent = fmt(m.mCore, 1) + " kg/s";
  stBpr.textContent = fmt(m.bpr, 1) + " : 1";
  stFan.textContent = fmt(m.fanShare, 0) + " % (" + fmt((m.thr * m.fanShare) / 100, 0) + " su " + fmt(m.thr, 0) + " kN)";
  explainEl.textContent =
    regimeLabel(cur) + ": l’albero di alta pressione (HP) gira a " + fmt(m.rpm2 / m.rpm1, 1) +
    "× la velocità dell’albero di bassa pressione (LP). Il flusso secondario porta " + fmt(m.bpr, 1) +
    " volte l’aria del primario e genera circa il " + fmt(m.fanShare, 0) + " % della spinta.";

  presets.forEach((b) => {
    const v = Number(b.dataset.preset);
    b.setAttribute("aria-pressed", String(Math.abs(target - v) < 4));
  });
}

function announce() {
  const m = model(target);
  const text = "Manetta " + Math.round(target) + " percento: N1 " + fmt(m.n1) + " percento, N2 " + fmt(m.n2) + " percento, rapporto di diluizione " + fmt(m.bpr);
  stage.setAttribute("aria-valuenow", String(Math.round(target)));
  stage.setAttribute("aria-valuetext", text);
  if (liveAnn && text !== lastAnnounce) { lastAnnounce = text; liveAnn.textContent = text; }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    clock += dt;
    target = 50 - 50 * Math.cos((clock / 14) * Math.PI * 2);
    slider.value = String(Math.round(target));
  }
  cur = calm ? target : cur + (target - cur) * (1 - Math.exp(-dt / 0.25));
  if (Math.abs(target - cur) < 0.05) cur = target;
  if (!calm) {
    const m = model(cur);
    const scaleRad = 0.00036;
    phiLP = (phiLP + m.rpm1 * scaleRad * dt) % (Math.PI * 2);
    phiHP = (phiHP + m.rpm2 * scaleRad * dt) % (Math.PI * 2);
    flowByp = (flowByp + (0.14 + 0.34 * m.u) * dt) % 1;
    flowCore = (flowCore + (0.18 + 0.36 * m.u) * dt) % 1;
  }
  draw();
  const keepGoing = visible && (!calm || cur !== target);
  frame = keepGoing ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}

function steer(next, fromUser = true) {
  target = clamp(next, 0, 100);
  slider.value = String(Math.round(target));
  if (fromUser) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (!still.matches) { touring = true; run(); } }, 9000);
    announce();
  }
  run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

document.addEventListener("visibilitychange", () => {
  if (document.hidden && frame) { cancelAnimationFrame(frame); frame = 0; }
  else if (!document.hidden && visible) run();
});

slider.addEventListener("input", () => steer(Number(slider.value)));
presets.forEach((b) => b.addEventListener("click", () => steer(Number(b.dataset.preset))));
stage.addEventListener("keydown", (e) => {
  const step = e.shiftKey ? 15 : 5;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); steer(target + step); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); steer(target - step); }
  else if (e.key === "Home") { e.preventDefault(); steer(0); }
  else if (e.key === "End") { e.preventDefault(); steer(100); }
});
draw();
announce();

window.addEventListener("keydown",function(e){if(e.key==="Escape"&&window.parent&&window.parent!==window){try{window.parent.postMessage("tf-close-fig","*");}catch(_){}}});
</script></body></html>
